version: 2.1

setup: true

orbs:
  continuation: circleci/continuation@1.0.0

jobs:
  filter-paths:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Determine changed services
          command: |
            PARAMS="{}"

            if git diff --name-only origin/main...HEAD | grep -q "^services/transaction-api/"; then
              PARAMS=$(echo $PARAMS | python3 -c "import sys,json; d=json.load(sys.stdin); d['run-transaction-api']=True; print(json.dumps(d))")
            fi

            if git diff --name-only origin/main...HEAD | grep -q "^services/fraud-scorer/"; then
              PARAMS=$(echo $PARAMS | python3 -c "import sys,json; d=json.load(sys.stdin); d['run-fraud-scorer']=True; print(json.dumps(d))")
            fi

            if git diff --name-only origin/main...HEAD | grep -q "^infra/"; then
              PARAMS=$(echo $PARAMS | python3 -c "import sys,json; d=json.load(sys.stdin); d['run-infra']=True; print(json.dumps(d))")
            fi

            echo $PARAMS > /tmp/pipeline-params.json
            cat /tmp/pipeline-params.json
      - continuation/continue:
          configuration_path: .circleci/continue_config.yml
          parameters: /tmp/pipeline-params.json

workflows:
  setup-workflow:
    jobs:
      - filter-paths
