version: 2.1

orbs:
  docker: circleci/docker@2.6.0

parameters:
  run-transaction-api:
    type: boolean
    default: false
  run-fraud-scorer:
    type: boolean
    default: false
  run-infra:
    type: boolean
    default: false

jobs:
  test:
    parameters:
      service:
        type: string
      python-version:
        type: string
    docker:
      - image: cimg/python:<< parameters.python-version >>
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            cd services/<< parameters.service >>
            pip install -r requirements.txt
      - run:
          name: Run tests (Python << parameters.python-version >>)
          command: |
            cd services/<< parameters.service >>
            pytest tests/ -v

  secret-scan:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Install TruffleHog v3
          command: |
            curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b $HOME/bin
      - run:
          name: Scan for secrets
          command: |
            export PATH=$HOME/bin:$PATH
            trufflehog filesystem . --fail

  sast-scan:
    parameters:
      service:
        type: string
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Install Semgrep
          command: pip install semgrep
      - run:
          name: Run SAST
          command: |
            semgrep scan services/<< parameters.service >> \
              --config=p/python \
              --error

  build-and-scan:
    parameters:
      service:
        type: string
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker image
          command: |
            docker build -t << parameters.service >>:$CIRCLE_SHA1 \
              services/<< parameters.service >>
      - run:
          name: Install Trivy
          command: |
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b $HOME/bin
      - run:
          name: Scan image for CVEs
          command: |
            export PATH=$HOME/bin:$PATH
            trivy image --exit-code 1 --severity CRITICAL \
              << parameters.service >>:$CIRCLE_SHA1

  deploy:
    parameters:
      service:
        type: string
      container-port:
        type: integer
    environment:
      ENVIRONMENT: dev
    docker:
      - image: cimg/azure:2024.03
    steps:
      - checkout
      - run:
          name: Azure Login
          command: |
            az login --service-principal \
              --username $AZURE_CLIENT_ID \
              --password $AZURE_CLIENT_SECRET \
              --tenant $AZURE_TENANT_ID
      - run:
          name: Deploy to Azure Container Apps
          command: |
            az containerapp update \
              --name << parameters.service >>-$ENVIRONMENT \
              --resource-group payment-fraud-$ENVIRONMENT-rg \
              --image hemantdeshwal19/<< parameters.service >>:$CIRCLE_SHA1

workflows:
  transaction-api-pipeline:
    when: << pipeline.parameters.run-transaction-api >>
    jobs:
      - secret-scan
      - sast-scan:
          service: transaction-api
      - test:
          matrix:
            parameters:
              service: [transaction-api]
              python-version: ["3.10", "3.11"]
      - build-and-scan:
          service: transaction-api
          requires:
            - secret-scan
            - sast-scan
            - test-3.10-transaction-api
            - test-3.11-transaction-api
      - deploy:
          service: transaction-api
          container-port: 8000
          requires:
            - build-and-scan
          context:
            - azure-dev
          filters:
            branches:
              only: dev

  fraud-scorer-pipeline:
    when: << pipeline.parameters.run-fraud-scorer >>
    jobs:
      - secret-scan
      - sast-scan:
          service: fraud-scorer
      - test:
          matrix:
            parameters:
              service: [fraud-scorer]
              python-version: ["3.10", "3.11"]
      - build-and-scan:
          service: fraud-scorer
          requires:
            - secret-scan
            - sast-scan
            - test-3.10-fraud-scorer
            - test-3.11-fraud-scorer
      - deploy:
          service: fraud-scorer
          container-port: 8001
          requires:
            - build-and-scan
          context:
            - azure-dev
          filters:
            branches:
              only: dev
